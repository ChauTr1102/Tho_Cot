services:
  backend:
    build:
      # Repo root, not ./backend: app/services/studio/demo_briefs.py and
      # from_research.py's photo-matching fallback both read `sample_data/`,
      # a sibling of backend/ at the repo root — with the context scoped to
      # ./backend alone, that directory was structurally unreachable by any
      # COPY instruction, so it silently never made it into the image. The
      # demo-brand studio flow (/studio/run, /studio/brands) had nothing to
      # read, and a real campaign's missing-photo fallback lost its sample
      # match candidates too — no crash (both paths already guard with
      # `.is_dir()`), just a silently disabled feature.
      context: .
      dockerfile: backend/Dockerfile
    image: thocot-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Tho Cot Commerce Campaign Copilot}
      API_V1_STR: ${API_V1_STR:-/api}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://thocot.io.vn","https://www.thocot.io.vn","http://localhost:3000"]}
      # sqlite:///./sql_app.db (the app's own default) resolves relative to
      # the container's cwd (/app), which is NOT under the /app/data volume
      # below — every `docker compose build && up` recreates the image
      # filesystem from scratch, so the whole database was silently wiped on
      # every rebuild. Pointed at /app/data instead, which is bind-mounted
      # from the host (see BACKEND_DATA_DIR below) and therefore survives a
      # rebuild the same way generated campaign assets already do.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/sql_app.db}
      ARK_API_KEY: ${ARK_API_KEY}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.ap-southeast.bytepluses.com/api/v3}
    volumes:
      # Persistent volume: generated campaign assets (studio_settings.DATA_DIR)
      # AND the SQLite database (DATABASE_URL above) both live under here now,
      # so a rebuild ("docker compose build && up", which recreates the
      # container filesystem from the image) keeps both instead of starting
      # from empty every time. Ownership of this host directory is fixed on
      # every container start by backend/docker-entrypoint.sh, regardless of
      # which UID created it on the host.
      - ${BACKEND_DATA_DIR:-./backend/data}:/app/data
    ports:
      # Exposed on the host so the VPS's system nginx (reverse proxy + SSL
      # termination, configured outside Docker) can forward /api/ here.
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - thocot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://thocot.io.vn/api}
    image: thocot-frontend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://thocot.io.vn/api}
    depends_on:
      - backend
    ports:
      # Exposed on the host so the VPS's system nginx can forward / here.
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - thocot-net

networks:
  thocot-net:
    driver: bridge
