services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: thocot-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Tho Cot Commerce Campaign Copilot}
      API_V1_STR: ${API_V1_STR:-/api}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://frontend:3000"]}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./sql_app.db}
      ARK_API_KEY: ${ARK_API_KEY}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.ap-southeast.bytepluses.com/api/v3}
    volumes:
      # JSON file-storage for campaign pipeline (backend/app/storage/campaign_store.py)
      - ${BACKEND_DATA_DIR:-./backend/data}:/app/data
    expose:
      - "8000"
    networks:
      - thocot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    image: thocot-frontend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - thocot-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - thocot-net

networks:
  thocot-net:
    driver: bridge
